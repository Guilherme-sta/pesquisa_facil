services:
  - type: web
    name: pesquisa-facil-ifpi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ENABLE_SUAP_LOGIN
        value: "false"
